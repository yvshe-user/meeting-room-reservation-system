name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: meeting-room-backend/pom.xml

      - name: Build backend
        run: mvn -B -f meeting-room-backend/pom.xml clean package

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: meeting-room-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: meeting-room-frontend
        run: npm ci

      - name: Check frontend
        working-directory: meeting-room-frontend
        run: npm run lint && npm run build

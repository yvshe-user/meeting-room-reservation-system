<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>会议室确认使用</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #669bea 0%, #293b6d 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
      }

      .icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
      }

      .icon.success {
        background: #10b981;
        color: white;
      }

      .icon.error {
        background: #ef4444;
        color: white;
      }

      .icon.loading {
        background: #3b82f6;
        color: white;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      h1 {
        color: #1f2937;
        margin-bottom: 20px;
        font-size: 24px;
      }

      .message {
        color: #6b7280;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .info {
        background: #f3f4f6;
        border-radius: 10px;
        padding: 20px;
        margin-top: 20px;
        text-align: left;
      }

      .info-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        color: #374151;
      }

      .info-item:last-child {
        margin-bottom: 0;
      }

      .info-label {
        font-weight: 600;
        color: #6b7280;
      }

      .btn {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 20px;
        transition: background 0.3s;
      }

      .btn:hover {
        background: #5568d3;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div id="loading" class="icon loading">⏳</div>
      <div id="successIcon" class="icon success hidden">✓</div>
      <div id="errorIcon" class="icon error hidden">✗</div>

      <h1 id="title">正在确认使用...</h1>
      <div class="message" id="message">请稍候，正在处理您的确认请求...</div>

      <div id="info" class="info hidden">
        <div class="info-item">
          <span class="info-label">确认ID：</span>
          <span id="confirmId">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">确认时间：</span>
          <span id="confirmedAt">-</span>
        </div>
      </div>

      <button id="closeBtn" class="btn hidden" onclick="window.close()">
        关闭
      </button>
    </div>

    <script>
      function getUrlParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }

      function formatDateTime(dateTimeStr) {
        if (!dateTimeStr) return "-";
        const date = new Date(dateTimeStr);
        return date.toLocaleString("zh-CN", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
      }

      async function confirmReservation() {
        const reservationId = getUrlParameter("reservationId");

        if (!reservationId) {
          showError("缺少预约ID参数");
          return;
        }

        try {
          const response = await fetch(
            `/api/reservation/confirm-by-scan?reservationId=${reservationId}`,
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
              },
            }
          );

          const result = await response.json();

          if (result.code === 200) {
            showSuccess(result);
          } else {
            showError(result.message || "确认失败");
          }
        } catch (error) {
          console.error("Error:", error);
          showError("网络错误，请稍后重试");
        }
      }

      function showSuccess(result) {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("successIcon").classList.remove("hidden");
        document.getElementById("title").textContent = "确认成功！";
        document.getElementById("message").textContent =
          result.message || "会议室使用确认成功";

        if (result.data) {
          document.getElementById("confirmId").textContent =
            result.data.confirmId || "-";
          document.getElementById("confirmedAt").textContent = formatDateTime(
            result.data.confirmedAt
          );
          document.getElementById("info").classList.remove("hidden");
        }

        document.getElementById("closeBtn").classList.remove("hidden");
      }

      function showError(message) {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("errorIcon").classList.remove("hidden");
        document.getElementById("title").textContent = "确认失败";
        document.getElementById("message").textContent = message;
        document.getElementById("closeBtn").classList.remove("hidden");
      }

      window.onload = function () {
        confirmReservation();
      };
    </script>
  </body>
</html>
